[package]
name = "voidtrack"
version = "0.1.0"
description = "Private local habit tracker"
edition = "2021"

[lib]
name = "voidtrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
nucleo-matcher = "0.3"
uuid = { version = "1", features = ["v4"] }

# Release-профиль: максимум скорости в рантайме, минимум размера бинарника.
# LTO + один codegen unit убирают кросс-крейтовые вызовы и дают ощутимый
# прирост на мобильных CPU; strip убирает отладочные символы из .so/.exe.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
